spring:
  config:
    activate:
      on-profile: oci-test
  datasource:
    # The Vault secret supplies the alert application's own DB connection.
    url:
    username:
    password:

oci:
  vault:
    # Bootstrap configuration: the secret OCID is needed before Vault can be read.
    secret-ids: ${OCI_VAULT_SECRET_IDS}
    region: ${OCI_VAULT_REGION:ap-chuncheon-1}

# Explicit local end-to-end profile. Do not activate this profile in prod.
alert:
  oci-monitoring:
    enabled: true
    region: ${OCI_REGION:ap-chuncheon-1}
    polling-interval-ms: ${OCI_MONITORING_POLLING_INTERVAL_MS:60000}
    query-window: 5m
    resolution: 1m
    mysql:
      db-systems:
        - id: ${OCI_MYSQL_DB_SYSTEM_ID}
          compartment-id: ${OCI_MYSQL_COMPARTMENT_ID}
          service: ${OCI_MYSQL_SERVICE:platform}
          team: ${OCI_MYSQL_TEAM:infra}
          enabled: true
          thresholds:
            # Deliberately low only for local Discord delivery checks.
            cpu-utilization:
              warning: 1.0
              critical: 2.0
            db-volume-utilization:
              warning: 1.0
              critical: 2.0
