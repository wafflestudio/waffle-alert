spring:
  config:
    activate:
      on-profile: local

oci:
  auth:
    type: config
  config:
    profile: ${OCI_CONFIG_PROFILE:DEFAULT}

alert:
  oci-monitoring:
    polling-interval-ms: 60000
    mysql:
      db-systems:
        wafflestudio-mysql:
          thresholds:
            # Deliberately low only for local Discord delivery checks.
            cpu-utilization:
              warning: 1.0
              critical: 2.0
            memory-utilization:
              warning: 1.0
              critical: 2.0
            db-volume-utilization:
              warning: 1.0
              critical: 2.0
