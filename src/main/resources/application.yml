spring:
  application:
    name: waffle-alert
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리. JPA는 검증만
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    baseline-version: 1
  datasource:
    url:
    username:
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

discord:
  bot-token:
  channel-ids:
    prometheus-alert: 1525123803284242512
    oci-cost: 1525123822322188308
    oci-monitoring: 1525123771420377200

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

oci:
  vault:
    secret-ids: ocid1.vaultsecret.oc1.ap-chuncheon-1.amaaaaaat2m5lbqadjrtaoxv4b2kmdicuk4ivfhhqqr4j2g2ecmqe4boknxq
    region: ap-chuncheon-1

alert:
  oci-monitoring:
    enabled: true
