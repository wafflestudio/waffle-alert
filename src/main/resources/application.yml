spring:
  application:
    name: waffle-alert
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리. JPA는 검증만
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    baseline-version: 1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

discord:
  channel-ids:
    prometheus-alert: 1525123803284242512
    oci-cost: 1525123822322188308
    oci-monitoring: 1525123771420377200
    team-infra-alert: 1538228022673408001
    k8s-alert: 1532713920232554646
    waffice-app-alert: 1545815162001424384
    waffice-infra-alert: 1546753138663362610
    wacruit-app-alert: 1545815197254688899
    wacruit-infra-alert: 1546753479157227540
    snutt-app-alert: 1545815248664133723
    snutt-infra-alert: 1546753835039457370
    siksha-app-alert: 1545815282054860861
    siksha-infra-alert: 1546753931768758322
    allclear-app-alert: 1545815310320537640
    allclear-infra-alert: 1546754731605627002
    hangsha-app-alert: 1545815417153519716
    hangsha-infra-alert: 1546754949550047252
    snuclear-app-alert: 1546784401713660045
    snuclear-infra-alert: 1546784422907482233

alert:
  team-mapping:
    # namespace -> 팀의 discord.channel-ids 키. app은 Loki 기반 애플리케이션 에러 로그
    # (ApplicationErrorLog), infra는 Prometheus/K8s watch 등 워크로드 alert (RoutingPolicy,
    # ChannelType 참고). 매핑에 없는 namespace/channelType은 소스 기준 기본 채널로 폴백한다.
    namespaces:
      waffle-alert-prod:
        app: team-infra-alert
        infra: team-infra-alert
      pupuri-prod:
        app: team-infra-alert
        infra: team-infra-alert
      waffice-prod:
        app: waffice-app-alert
        infra: waffice-infra-alert
      wacruit-prod:
        app: wacruit-app-alert
        infra: wacruit-infra-alert
      snutt-prod:
        app: snutt-app-alert
        infra: snutt-infra-alert
      siksha-prod:
        app: siksha-app-alert
        infra: siksha-infra-alert
      allclear-prod:
        app: allclear-app-alert
        infra: allclear-infra-alert
      hangsha-prod:
        app: hangsha-app-alert
        infra: hangsha-infra-alert
      snuclear-prod:
        app: snuclear-app-alert
        infra: snuclear-infra-alert
  oci:
    auth-type: config_file          # local 기본. prod 프로파일에서 instance_principal로 오버라이드
    config-file-path: ~/.oci/config
    profile: DEFAULT
    tenant-id: ${OCI_TENANT_ID:}    # ocid1.tenancy.oc1..xxxx
    region: ap-chuncheon-1
  oci-cost:
    spike:
      settle-lag-days: 1            # 마지막 N일은 비용 데이터가 불완전해 판단에서 제외 (48h 지연 대비 안전값)
      warning-multiplier: 1.3       # 전일 비용 대비 이 배수 이상이면 WARNING
      critical-multiplier: 2.0      # 이 배수 이상이면 CRITICAL
      min-average-amount: 0.5       # 전일 비용이 이 값 미만이면 소액 오탐 방지로 판단 스킵 (테넌시 통화 SGD, 하루 ~1)
  k8s:
    # 쿠버네티스 API의 watch 스트림으로 Pod/Job/Node 이벤트를 받는다. prod에서만 켠다.
    # 로컬에서 시험하려면 `kubectl proxy --port=8001`을 띄우고 api-url을 http://localhost:8001로 두면 된다.
    enabled: false
    api-url: https://kubernetes.default.svc
    namespace: ""             # 비우면 클러스터 전체
    pod: true
    job: true
    node: true
    min-backoff: 1s
    max-backoff: 60s
    watch-timeout: 5m         # 이 시간마다 API 서버가 커넥션을 정상 종료 -> 재접속
    connect-timeout: 5s       # watch에는 read timeout을 두지 않는다
    api-read-timeout: 10s     # watch가 아닌 일반 요청용
    max-alerts-per-pod: 3     # 같은 파드에 최대 3회
  loki:
    # 클러스터 내부 서비스 주소. local 프로파일에서는 `kubectl port-forward svc/loki 3100:3100`으로
    # 우회 접근한다 (docs/architecture.md의 "로컬에서 각 source 테스트하는 법" 패턴).
    base-url: http://loki.loki.svc.cluster.local:3100
    grafana-base-url: https://grafana.wafflestudio.com
    query-window-minutes: 5   # namespace+시간창 조회 범위
    max-lines: 50              # Discord 메시지 길이 제한(2000자) 고려해 과도한 라인 수 방지
  exchange-rate:
    base-url: https://api.frankfurter.dev
    cache-ttl-hours: 12
    failure-retry-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true

---
# ───────────────────────────────────────────────
# local: 로컬 Docker MySQL 직접 연결 (docker-compose.yml)
# ───────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/waffle_alert?serverTimezone=UTC&characterEncoding=UTF-8
    username: alert
    password: alertpw
    driver-class-name: com.mysql.cj.jdbc.Driver

---
# ───────────────────────────────────────────────
# prod: DB 등 secret은 OCI Vault에서 주입 (snutt 패턴)
# oci-vault starter가 secret-ids의 OCID에서 datasource 값을 주입한다.
# 인증은 starter가 자동 처리 (쿠버네티스 Pod는 instance_principal, Dynamic Group + Policy 필요).
# ───────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url:                          # Vault 주입
    username:                     # Vault 주입
    password:                     # Vault 주입
    driver-class-name: com.mysql.cj.jdbc.Driver

oci:
  vault:
    secret-ids: ocid1.vaultsecret.oc1.ap-chuncheon-1.amaaaaaat2m5lbqadjrtaoxv4b2kmdicuk4ivfhhqqr4j2g2ecmqe4boknxq
    region: ap-chuncheon-1

discord:
  bot-token:                        # Vault 주입. channel-ids는 고정값이라 root discord.channel-ids 그대로 사용

alert:
  oci:
    auth-type: instance_principal   # 쿠버네티스 Pod에서 instance principal 인증 (Dynamic Group + Policy 필요)
    tenant-id:                      # Vault 주입 (또는 고정 OCID)

  k8s:
    # ServiceAccount에 pods/jobs/nodes ClusterRole이 필요하다
    # (waffle-world-oci/argocd/waffle-alert-prod/waffle-alert.yaml).
    enabled: true
