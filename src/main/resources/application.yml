spring:
  application:
    name: waffle-alert
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate          # 스키마는 Flyway가 관리. JPA는 검증만
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    baseline-version: 1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 8080

discord:
  channel-ids:
    prometheus-alert: 1525123803284242512
    oci-cost: 1525123822322188308
    oci-monitoring: 1525123771420377200
    team-infra-alert: 1538228022673408001

alert:
  team-mapping:
    # namespace -> discord.channel-ids의 키. Loki 기반 alert(ApplicationErrorLog 등)를
    # namespace 기준으로 팀 채널에 우선 라우팅한다 (RoutingPolicy 참고). 매핑에 없는
    # namespace는 소스 기준 기본 채널(channelKeyOf)로 폴백한다.
    namespace-to-channel:
      waffle-alert-prod: team-infra-alert
      pupuri-prod: team-infra-alert
  oci:
    auth-type: config_file          # local 기본. prod 프로파일에서 instance_principal로 오버라이드
    config-file-path: ~/.oci/config
    profile: DEFAULT
    tenant-id: ${OCI_TENANT_ID:}    # ocid1.tenancy.oc1..xxxx
    region: ap-chuncheon-1
  oci-cost:
    spike:
      settle-lag-days: 1            # 마지막 N일은 비용 데이터가 불완전해 판단에서 제외 (48h 지연 대비 안전값)
      warning-multiplier: 1.5       # 직전 7일 평균 대비 이 배수 이상이면 WARNING
      critical-multiplier: 2.0      # 이 배수 이상이면 CRITICAL
      min-average-amount: 0.5       # 직전 7일 평균이 이 값 미만이면 소액 오탐 방지로 판단 스킵 (테넌시 통화 SGD, 하루 ~1)
  loki:
    # 클러스터 내부 서비스 주소. local 프로파일에서는 `kubectl port-forward svc/loki 3100:3100`으로
    # 우회 접근한다 (docs/architecture.md의 "로컬에서 각 source 테스트하는 법" 패턴).
    base-url: http://loki.loki.svc.cluster.local:3100
    grafana-base-url: https://grafana.wafflestudio.com
    query-window-minutes: 5   # namespace+시간창 조회 범위
    max-lines: 50              # Discord 메시지 길이 제한(2000자) 고려해 과도한 라인 수 방지

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
