name: Deploy-prod

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Build & Push to OCIR
    runs-on: ubuntu-24.04-arm

    env:
      IMAGE_TAG: ${{ github.run_number }}
      OCIR_REGISTRY: yny.ocir.io
      OCIR_NAMESPACE: ax1dvc8vmenm
      OCIR_REPOSITORY: waffle-alert-prod/waffle-alert

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO(외부설정): OCI_AUTH_TOKEN 을 레포 Settings > Secrets 에 등록해야 함.
      #   - OCIR push 용 auth token. OCI 콘솔에서 발급.
      #   - 사용자명도 실제 deployer 계정으로 교체 필요 (members/<deployer>).
      - name: Login to OCIR
        run: echo "${{ secrets.OCI_AUTH_TOKEN }}" | docker login $OCIR_REGISTRY -u $OCIR_NAMESPACE/members/waffle-deployer --password-stdin

      - name: Build & push image
        run: |
          echo "${{ github.token }}" > .github_token
          docker build \
            --secret id=github_token,src=./.github_token \
            -t $OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:$IMAGE_TAG \
            -t $OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:latest \
            --platform linux/arm64 \
            .
          rm -f .github_token
          docker push $OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:$IMAGE_TAG
          docker push $OCIR_REGISTRY/$OCIR_NAMESPACE/$OCIR_REPOSITORY:latest

      # ocir-image-updater(레지스트리 push를 감지해 태그를 갱신하던 방식)는 간헐적 오류로
      # 폐기되고, 이 파이프라인이 직접 kustomize overlay의 태그를 올리는 방식으로 대체됐다
      # (인프라팀 공지, snutt-ev 928b3f7 참고). image는 argocd/waffle-alert-prod/kustomization.yaml의
      # images[].name과 정확히 일치해야 한다.
      - name: Update GitOps image tag
        uses: wafflestudio/waffle-world-oci/.github/actions/update-image@main
        with:
          image: ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.OCIR_REPOSITORY }}
          tag: ${{ env.IMAGE_TAG }}
          overlay-path: argocd/waffle-alert-prod
          private-key: ${{ secrets.DEPLOYER_APP_PRIVATE_KEY }}